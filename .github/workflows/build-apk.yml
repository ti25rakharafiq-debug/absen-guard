name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          mkdir -p app
          keytool -genkeypair -v -keystore app/release.keystore -alias absenguard -keyalg RSA -keysize 2048 -validity 10000 -storepass absenguard123 -keypass absenguard123 -dname "CN=AbsenGuard, OU=Mobile, O=Personal, L=Karawang, ST=JawaBarat, C=ID"

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: absenguard-apk
          path: app/build/outputs/apk/release/app-release.apk
